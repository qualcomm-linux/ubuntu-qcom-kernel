#
# premerge-main.yml - pre-merge build check for pull requests to main.
#
# main holds the CI that every resolute-qcom-devel build runs: premerge-pr.yml
# and the nightly both call build-kernel.yml@main. This builds
# resolute-qcom-devel with the PR's own build-kernel.yml (called by local path)
# and the PR's own scripts (ci_scripts_ref), so a CI change is exercised before
# it can break every devel build. Build only: no S3 upload, no distro images.

name: "Pre-merge main build"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: premerge-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build check"
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Workspace-relative on purpose: this is a job-level call, resolved before
    # any step runs, and actionlint does not yet parse the $/ form.
    uses: ./.github/workflows/build-kernel.yml # zizmor: ignore[self-repository]
    with:
      ref: resolute-qcom-devel
      ci_scripts_ref: refs/pull/${{ github.event.pull_request.number }}/merge
      skip_s3: true
      dbgsym: false
      flavours: qcom
